<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperMimic · LAFAN1 demo GIFs · 48k</title>
<style>
  :root { color-scheme: dark; --bg:#0e1116; --panel:#161b23; --line:#252c38; --text:#e8ecf3; --muted:#9aa6b8; --accent:#6ea8fe; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.5; }
  main { max-width:1100px; margin:0 auto; padding:40px 22px 60px; }
  h1 { font-size:28px; letter-spacing:-0.02em; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  figure { margin:0; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  img { display:block; width:100%; height:auto; background:#000; }
  figcaption { padding:10px 12px; font-size:13px; color:#cfd8e8; }
  figcaption span { color:var(--muted); }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .links { display:flex; flex-wrap:wrap; gap:10px; margin:22px 0; }
  .links a { background:#1b2330; border:1px solid var(--line); padding:8px 12px; border-radius:9px; font-size:13px; }
  @media (max-width:900px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<main>
  <h1>SuperMimic · LAFAN1 demo GIFs</h1>
  <div class="sub">48k checkpoint · RTX 5080 16GB · white = policy, translucent blue = reference ghost</div>
  <div class="links">
    <a href="../../../index.html">Live page</a>
    <a href="https://github.com/rzc156/supermimic-rtx5080">GitHub</a>
    <a href="https://github.com/rzc156/supermimic-rtx5080/blob/main/REPRODUCTION.md">Reproduction report</a>
  </div>
  <div class="grid">
    <figure><img loading="lazy" src="walk1.gif" alt="walk"><figcaption>walk1_subject1 <span>· 6 s</span></figcaption></figure>
    <figure><img loading="lazy" src="run1.gif" alt="run"><figcaption>run1_subject5 <span>· 6 s</span></figcaption></figure>
    <figure><img loading="lazy" src="sprint1.gif" alt="sprint"><figcaption>sprint1_subject4 <span>· 6 s</span></figcaption></figure>
    <figure><img loading="lazy" src="jump.gif" alt="jump"><figcaption>jumps1_subject2 <span>· 7 s</span></figcaption></figure>
    <figure><img loading="lazy" src="dance1.gif" alt="dance 1"><figcaption>dance1_subject1 <span>· 6 s</span></figcaption></figure>
    <figure><img loading="lazy" src="dance2.gif" alt="dance 2"><figcaption>dance2_subject1 <span>· 6 s</span></figcaption></figure>
  </div>
  <div class="sub" style="margin-top:20px">GIFs are 320 px / 10 fps, generated from the 48k policy. Full MP4s are in <a href="../videos/">videos/</a>.</div>
</main>
</body>
</html>
